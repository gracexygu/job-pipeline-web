<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#f3f1eb">
  <title>Job Pipeline</title>
  <link rel="icon" href="data:,">
  <link rel="stylesheet" href="./styles.css">
</head>
<body>
  <header class="topbar">
    <div class="brand-lockup">
      <a class="home-mark-link" href="./" aria-label="回到投递主页" title="回到投递主页"><span class="breathing-home" aria-hidden="true"><i></i><i></i><i></i></span></a>
      <div>
        <span class="eyebrow">CAREER OPERATIONS</span>
        <h1>秋招投递主面板</h1>
      </div>
    </div>
    <nav class="top-tabs" aria-label="主视图">
      <button class="active" data-view="pipeline" aria-current="page">投递管理</button>
      <button data-view="resume">简历排版</button>
      <button data-view="application">网申投递</button>
    </nav>
    <div class="header-meta">
      <span class="source-status"><i aria-hidden="true"></i><span id="importMeta">正在载入浏览器数据</span></span>
      <button id="webData" class="secondary-action" type="button">导入 Excel / CSV</button>
      <a class="web-lark-link" href="https://my.feishu.cn/base/G5xUbSCRFaEViosGhntcyCWanzc?table=ldx1rDVnmT1I8eNp" target="_blank" rel="noreferrer">多维表格</a>
      <button id="refresh" class="icon-button" title="刷新数据" aria-label="刷新数据">↻</button>
    </div>
  </header>
  <main>
    <div id="notice" class="notice hidden" role="status" aria-live="polite"></div>
    <section id="pipelineView">
      <section class="toolbar" aria-label="筛选岗位">
        <div id="stages" class="segments" role="group" aria-label="按阶段筛选"></div>
        <div class="filter-tools">
          <label class="search-field"><span class="visually-hidden">搜索岗位</span><span aria-hidden="true">⌕</span><input id="search" type="search" placeholder="搜索公司、岗位或 JD" autocomplete="off"></label>
          <label class="recommendation-filter"><span class="visually-hidden">推荐动作</span><select id="recommendation"><option value="">全部动作</option><option>立即投递</option><option>补信息</option><option>尽快投递</option><option>跟进</option><option>复盘</option><option>暂不投</option></select></label>
          <span id="resultCount" class="result-count" aria-live="polite"></span>
          <button id="addColumn" class="secondary-action" type="button"><span aria-hidden="true">＋</span>新增列</button>
          <button id="resetColumns" class="secondary-action" type="button">恢复默认列序</button>
          <button id="add" class="add-position" type="button"><span aria-hidden="true">＋</span>新增岗位</button>
        </div>
      </section>
      <div id="positionViewSwitch" class="position-view-switch" role="group" aria-label="全部岗位视图">
        <button type="button" data-position-view="table" aria-pressed="true">表格</button>
        <button type="button" data-position-view="dashboard" aria-pressed="false">仪表盘</button>
      </div>
      <section class="workspace" aria-label="岗位工作台">
        <div class="table-wrap">
          <table class="data-grid">
            <thead><tr id="columnHeaders"></tr></thead>
            <tbody id="rows"></tbody>
          </table>
        </div>
      </section>
      <section id="dashboardWorkspace" class="dashboard-workspace hidden" aria-label="投递仪表盘"></section>
      <section id="assessmentWorkspace" class="assessment-workspace hidden" aria-label="待测评任务看板"></section>
      <section id="intentsWorkspace" class="intents-workspace hidden" aria-label="待确认变更"></section>
      <section id="sourcesWorkspace" class="sources-workspace hidden" aria-label="检索新机会"></section>
      <section id="interviewWorkspace" class="interview-workspace hidden" aria-label="面试轮次进度"></section>
    </section>
    <section id="resumeView" class="tool-view hidden" aria-label="简历排版工具">
      <iframe id="resumeFormatter" title="简历排版工具" loading="lazy"></iframe>
    </section>
    <section id="applicationView" class="application-view hidden" aria-label="网申通用事实表">
      <header class="facts-toolbar">
        <div>
          <span class="eyebrow">APPLICATION FACTS</span>
          <h2>网申通用事实表</h2>
          <p id="factsMeta">正在读取当前浏览器中的 Markdown</p>
        </div>
        <div class="facts-tools">
          <div id="factsPreviewTools" class="facts-preview-tools">
            <label class="search-field"><span class="visually-hidden">搜索网申事实</span><span aria-hidden="true">⌕</span><input id="factsSearch" type="search" placeholder="搜索字段、经历或内容" autocomplete="off"></label>
            <label class="sensitive-toggle"><input id="showSensitive" type="checkbox"><span>显示敏感字段</span></label>
            <button id="importFacts" class="facts-edit-button" type="button">导入 Markdown</button>
            <button id="editFacts" class="facts-edit-button" type="button">编辑 Markdown</button>
          </div>
          <div id="factsEditTools" class="facts-edit-tools hidden">
            <span id="factsEditState">未保存</span>
            <button id="cancelFactsEdit" type="button">取消</button>
            <button id="saveFacts" class="primary" type="button">保存</button>
          </div>
        </div>
      </header>
      <div class="facts-layout">
        <nav id="factsNav" class="facts-nav" aria-label="事实表分组"></nav>
        <div id="factsContent" class="facts-content"></div>
        <div id="factsEditorPane" class="facts-editor-pane hidden">
          <textarea id="factsEditor" spellcheck="false" aria-label="编辑网申事实库 Markdown"></textarea>
        </div>
      </div>
    </section>
  </main>
  <dialog id="columnDialog" class="editor-dialog" aria-labelledby="columnDialogTitle">
    <form id="columnForm" method="dialog">
      <header><div><span class="eyebrow">TABLE COLUMN</span><h2 id="columnDialogTitle">新增列</h2></div><button class="dialog-close" type="button" data-close-dialog="columnDialog" aria-label="关闭">×</button></header>
      <label>列名<input id="columnLabel" required maxlength="40" autocomplete="off"></label>
      <label>类型<select id="columnKind"><option value="text">单行文本</option><option value="textarea">多行文本</option><option value="select">单选</option><option value="url">链接</option><option value="datetime">日期时间</option></select></label>
      <label id="columnOptionsField" class="hidden">选项<textarea id="columnOptions" rows="5" placeholder="每行一个选项"></textarea></label>
      <label>列宽<input id="columnWidth" type="number" min="90" max="600" step="10" value="160"></label>
      <div id="columnOrderActions" class="column-order-actions hidden"><button id="moveColumnLeft" type="button">← 左移</button><button id="moveColumnRight" type="button">右移 →</button></div>
      <footer><button id="deleteColumn" class="danger-action hidden" type="button">删除列</button><span></span><button type="button" data-close-dialog="columnDialog">取消</button><button id="saveColumn" class="primary" type="submit">保存</button></footer>
    </form>
  </dialog>
  <dialog id="rowDialog" class="editor-dialog" aria-labelledby="rowDialogTitle">
    <form id="rowForm" method="dialog">
      <header><div><span class="eyebrow">POSITION</span><h2 id="rowDialogTitle">新增岗位</h2></div><button class="dialog-close" type="button" data-close-dialog="rowDialog" aria-label="关闭">×</button></header>
      <div class="dialog-grid"><label>公司<input id="draftCompany" required autocomplete="organization"></label><label>岗位<input id="draftRole" required autocomplete="off"></label></div>
      <div class="dialog-grid"><label>推荐动作<select id="draftRecommendation"></select></label><label>截止 / 提醒<input id="draftDeadline" type="datetime-local"></label></div>
      <label>投递链接<input id="draftUrl" type="url" placeholder="https://"></label>
      <label>岗位 JD<textarea id="draftJd" rows="6"></textarea></label>
      <footer><span></span><span></span><button type="button" data-close-dialog="rowDialog">取消</button><button id="saveDraft" class="primary" type="submit">创建</button></footer>
    </form>
  </dialog>
  <dialog id="sourceDialog" class="editor-dialog" aria-labelledby="sourceDialogTitle">
    <form id="sourceForm" method="dialog">
      <header><div><span class="eyebrow">INFORMATION SOURCE</span><h2 id="sourceDialogTitle">新增信息源</h2></div><button class="dialog-close" type="button" data-close-dialog="sourceDialog" aria-label="关闭">×</button></header>
      <label>名称<input id="sourceName" required maxlength="160" placeholder="例如：公司招聘官网"></label>
      <label>链接<input id="sourceUrl" type="url" maxlength="500" placeholder="https://"></label>
      <div class="dialog-grid"><label>类型<input id="sourceType" maxlength="80" placeholder="官网 / 社区 / 表格"></label><label>可信度<input id="sourceCredibility" maxlength="80" placeholder="已验证 / 待核验"></label></div>
      <footer><span></span><button type="button" data-close-dialog="sourceDialog">取消</button><button class="primary" type="submit">保存</button></footer>
    </form>
  </dialog>
  <dialog id="dashboardLaneDialog" class="editor-dialog dashboard-config-dialog" aria-labelledby="dashboardLaneDialogTitle">
    <form id="dashboardLaneForm" method="dialog">
      <header><div><span class="eyebrow">PROGRESS BOARD</span><h2 id="dashboardLaneDialogTitle">新增分层</h2></div><button class="dialog-close" type="button" data-close-dialog="dashboardLaneDialog" aria-label="关闭">×</button></header>
      <label>分层名称<input id="dashboardLaneName" required maxlength="40" placeholder="例如：二面 / 已挂"></label>
      <label>分层颜色<input id="dashboardLaneColor" type="color" value="#6c8496" aria-label="分层颜色"></label>
      <label>包含的岗位阶段<select id="dashboardLaneStages" multiple size="6" aria-label="包含的岗位阶段"><option value="待补信息">待补信息</option><option value="待投递">待投递</option><option value="简历初筛中">简历初筛中</option><option value="待测评">待测评</option><option value="业务复筛中">业务复筛中</option><option value="待面试">待面试</option><option value="面试中">面试中</option><option value="简历挂">简历挂</option><option value="面试挂">面试挂</option><option value="已 Offer">已 Offer</option></select></label>
      <p class="dialog-hint">同一岗位阶段只归属一个分层；保存后会自动从其他分层移除。未匹配的岗位会出现在“未分层”。</p>
      <div id="dashboardLaneOrderActions" class="column-order-actions hidden"><button id="dashboardLaneMoveUp" type="button">↑ 上移</button><button id="dashboardLaneMoveDown" type="button">下移 ↓</button></div>
      <footer><button id="dashboardLaneDelete" class="danger-action hidden" type="button">删除分层</button><span></span><button type="button" data-close-dialog="dashboardLaneDialog">取消</button><button class="primary" type="submit">保存</button></footer>
    </form>
  </dialog>
  <script src="./vendor/read-excel-file.min.js"></script>
  <script type="module" src="./app.js"></script>
</body>
</html>
